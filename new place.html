<p>
自嘲熊是一隻擅長用幽默面對生活的小熊，最大的特點就是「先笑自己再說」。
雖然常常覺得自己很廢，但其實內心很努力，只是不太敢說出口。
</p>

<ul class="character-list">

    是一群“薯饼”，总是集体行动，性格各异的它们喜欢喋喋不休地说话和唱歌。值得一提的是，它们是可以吃的食物
    </p>
</li>

    每次都陪著自嘲熊一起拖到最後一刻才開始努力。
    </p>
</li>

<li>

    <img src="大~狗.jfif" alt="正能量狗">

    </p>
