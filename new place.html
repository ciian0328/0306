<h1>今天也在自嘲中努力活著</h1>

<img src="自嘲熊.png" alt="自嘲熊" class="main-img">

<p>
自嘲熊是一隻擅長用幽默面對生活的小熊，最大的特點就是「先笑自己再說」。
雖然常常覺得自己很廢，但其實內心很努力，只是不太敢說出口。
</p>

<h2>自嘲熊的日常夥伴</h2>

<ul class="character-list">

<li>
    <h3>鼴鼠可樂餅</h3>
    <img src="鼴鼠可樂餅.jpg" alt="鼴鼠可樂餅">
    <p>
    是一群「薯餅」，總是集體行動，性格各異的它們喜歡喋喋不休地說話和唱歌。值得一提的是，它們是可以吃的食物
    </p>
</li>

<li>
    <h3>帕格</h3>
    <img src="帕格.jpg" alt="帕格">
    <p>
    拖延貓的座右銘是「等一下再做」。
    每次都陪著自嘲熊一起拖到最後一刻才開始努力。
    </p>
</li>

<li>
    <h3>大狗</h3>
    <img src="大狗.jpg" alt="大狗">
    <p>
    總是試圖鼓勵大家，但常常被自嘲熊吐槽。
    雖然有點吵，但其實是團隊中最重要的存在。
    </p>
</li>

</ul>
