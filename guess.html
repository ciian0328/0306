<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>

    <link rel="stylesheet" href="guess.css">
</head>

<body>

  <div class="container">
    <h1>🎯 猜數字遊戲</h1>

    <label for="guessField">猜一個數字 (1 到 100):</label>

    <input type="number" class="guessField" id="guessField" min="1" max="100">

    <p class="hint">* 輸入數字後可按 Enter 提交</p>

    <div class="btn-group">
        <button class="guessSubmit">提交</button>
        <button class="restartBtn">重新開始</button>
    </div>

    <p>猜過：<span class="guesses"></span></p>
    <p class="count">猜測次數：0</p>

    <div class="result"></div>

    <a href="index.html" class="homeBtn">回主頁</a>
  </div>

  <script src="guess.js"></script>
</body>
</html>
